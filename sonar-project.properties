# SonarQube analysis for ACEest Fitness & Gym.
# Jenkins supplies the server URL and token (withSonarQubeEnv) and the version.
# Local run:  sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

sonar.sources=app.py,ACEest_Fitness.py,k8s
sonar.tests=tests
sonar.exclusions=legacy/**,Screenshots/**
sonar.python.version=3.10,3.11,3.12

# Written by: pytest --junitxml=test-results.xml --cov-report=xml (see the Jenkinsfile)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
