name: ACEest CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m compileall -q app.py wsgi.py tests

      - name: Lint with flake8
        run: flake8 .

  docker-build-and-test:
    name: Docker Image Assembly & Automated Testing
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .

      - name: Run Pytest inside the container (coverage gate 90%)
        run: docker run --rm aceest-fitness:test

      - name: Build runtime image
        run: docker build -t aceest-fitness:${{ github.sha }} .

      - name: Smoke test the running container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && break
            sleep 2
          done
          curl -fs http://localhost:5000/health
          curl -fs -X POST http://localhost:5000/clients \
               -H "Content-Type: application/json" \
               -d '{"name": "Smoke", "height": 175, "weight": 70, "program": "MG"}'
          curl -fs http://localhost:5000/clients/Smoke/bmi
          test "$(docker inspect -f '{{.Config.User}}' aceest)" = "aceest"

      - name: Show container logs on failure
        if: failure()
        run: docker logs aceest || true

      - name: Remove container
        if: always()
        run: docker rm -f aceest || true
