apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
  labels:
    app: aceest
    strategy: shadow
spec:
  selector:
    app: aceest
    strategy: shadow
    track: primary
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
  labels:
    app: aceest
    strategy: shadow
spec:
  selector:
    app: aceest
    strategy: shadow
    track: shadow
  ports:
    - name: http
      port: 80
      targetPort: http
