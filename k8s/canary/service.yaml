apiVersion: v1
kind: Service
metadata:
  name: aceest-stable
  namespace: aceest
  labels:
    app: aceest
    strategy: canary
spec:
  selector:
    app: aceest
    strategy: canary
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
  labels:
    app: aceest
    strategy: canary
spec:
  selector:
    app: aceest
    strategy: canary
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: http
