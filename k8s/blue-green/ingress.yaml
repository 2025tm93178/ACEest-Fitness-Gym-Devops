apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels:
    app: aceest
    strategy: blue-green
spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-bluegreen
                port:
                  number: 80
